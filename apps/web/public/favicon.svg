<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient (Espresso Noir) -->
    <linearGradient id="cgBgGrad" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#24190F" />
      <stop offset="45%" stop-color="#171009" />
      <stop offset="100%" stop-color="#080503" />
    </linearGradient>

    <!-- Bezel Ring Gradient (Specular Sandstone to Bronze) -->
    <linearGradient id="cgBorderGrad" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF7F2" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#E1DCC9" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#8F7554" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#412D15" stop-opacity="0.85" />
    </linearGradient>

    <!-- Gold / Sandstone Primary Gradient -->
    <linearGradient id="cgGoldTop" x1="14" y1="15" x2="50" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FAF7F2" />
      <stop offset="65%" stop-color="#E1DCC9" />
      <stop offset="100%" stop-color="#C9BF9F" />
    </linearGradient>

    <!-- Deep Bronze Gold Shade -->
    <linearGradient id="cgGoldDark" x1="18" y1="28" x2="46" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E1DCC9" />
      <stop offset="40%" stop-color="#A48762" />
      <stop offset="100%" stop-color="#5C4223" />
    </linearGradient>

    <!-- Radiant AI Satellite Sparkle Gradient -->
    <linearGradient id="cgSparkleGrad" x1="42" y1="9" x2="52" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E1DCC9" />
      <stop offset="100%" stop-color="#8F7554" />
    </linearGradient>

    <!-- Ambient Center Warmth -->
    <radialGradient id="cgGlow" cx="32" cy="28" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E1DCC9" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#412D15" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Dimensional Pop -->
    <filter id="cgShadow" x="8" y="8" width="48" height="48" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Luxury Double-Bezel Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#cgBgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#cgGlow)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#cgBorderGrad)" stroke-width="1.75" />
  <rect x="4.5" y="4.5" width="55" height="55" rx="13.5" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />

  <!-- Centerpiece: Academic Crown + Intelligence Node -->
  <g filter="url(#cgShadow)">
    <!-- Academic Mortarboard Rhombus Top -->
    <path d="M32 15 L50 24.5 L32 34 L14 24.5 Z" fill="url(#cgGoldTop)" />

    <!-- 3D Specular Shading Facets -->
    <path d="M14 24.5 L32 34 L32 24.5 Z" fill="#8F7554" fill-opacity="0.25" />
    <path d="M50 24.5 L32 34 L32 24.5 Z" fill="#412D15" fill-opacity="0.38" />

    <!-- Mortarboard Cap Neck / Foundation -->
    <path d="M21 29 L21 36.5 C21 42.5 25.8 46 32 46 C38.2 46 43 42.5 43 36.5 L43 29 C40.8 31.8 36.8 33.2 32 33.2 C27.2 33.2 23.2 31.8 21 29 Z" fill="url(#cgGoldDark)" />

    <!-- Pedestal Crest Finial -->
    <path d="M27 44.5 C27 48.5 29.2 51 32 52 C34.8 51 37 44.5 37 44.5 Z" fill="url(#cgGoldTop)" />

    <!-- Academic Tassel Ribbon & Pearl -->
    <path d="M32 24.5 C38 24.5 43.5 27 45.5 32.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.95" />
    <circle cx="45.5" cy="34" r="1.5" fill="#FAF7F2" />

    <!-- Central Intelligence Core Spark (Cut into Mortarboard Center) -->
    <path d="M32 20.5 C32 22.8 33.3 24.2 35.5 24.2 C33.3 24.2 32 25.6 32 27.9 C32 25.6 30.7 24.2 28.5 24.2 C30.7 24.2 32 22.8 32 20.5 Z" fill="#171009" />

    <!-- Satellite AI Stella Nova (Upper Right Accent) -->
    <path d="M47 9.5 C47 11.5 48.2 12.7 50.2 12.7 C48.2 12.7 47 13.9 47 15.9 C47 13.9 45.8 12.7 43.8 12.7 C45.8 12.7 47 11.5 47 9.5 Z" fill="url(#cgSparkleGrad)" />
    <circle cx="47" cy="12.7" r="0.75" fill="#FFFFFF" />
  </g>
</svg>