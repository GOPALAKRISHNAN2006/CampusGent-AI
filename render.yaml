services:
  - type: web
    name: campusgent-server
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:shared && npm run build:server
    startCommand: node apps/server/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: AUTO_SEED
        value: "true"
      - key: ALLOW_SEED_IN_PRODUCTION
        value: "true"
      - key: AI_API_KEY
        sync: false
      - key: AI_API_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_MODEL
        value: gemini-1.5-flash
